services:
  postgres:
    image: postgres:16
    container_name: telegram-monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: telegram_monitor
      POSTGRES_USER: telegram
      POSTGRES_PASSWORD: telegram_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
